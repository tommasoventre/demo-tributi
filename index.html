<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogo Procedimenti Tributi</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-italia@2.18.1/dist/css/bootstrap-italia.min.css">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web&display=swap" rel="stylesheet">
<style>
body { font-family: 'Titillium Web', sans-serif; }
.chip { cursor:pointer; padding:8px 12px; border:1px solid #ccc; border-radius:4px; }
.chip.active { background:#06c; color:white; }
.gruppo-tributo.is-hidden { display:none; }
.hero { background:#f5f7fa; padding:40px; }
</style>
</head>
<body>
<div class="hero">
<div class="container">
<h1>Catalogo Procedimenti Tributari</h1>
<p>Demo professionale</p>
</div>
</div>
<div class="container mt-4">
<div class="d-flex gap-2 mb-4 chip-filter">
<div class="chip active" data-filter="all">Tutti</div>
<div class="chip" data-filter="imu">IMU</div>
<div class="chip" data-filter="tari">TARI</div>
</div>
<div class="gruppo-tributo" data-tributo="imu">
<h2>IMU</h2>
<div class="accordion" id="acc1">
<div class="accordion-item">
<button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#i1">Regolamento IMU</button>
<div id="i1" class="accordion-collapse collapse show"><div class="accordion-body">Procedimento IMU</div></div>
</div>
</div>
</div>
<div class="gruppo-tributo" data-tributo="tari">
<h2>TARI</h2>
<div class="accordion" id="acc2">
<div class="accordion-item">
<button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#t1">Iscrizione TARI</button>
<div id="t1" class="accordion-collapse collapse"><div class="accordion-body">Procedimento TARI</div></div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-italia@2.18.1/dist/js/bootstrap-italia.bundle.min.js"></script>
<script>
document.querySelectorAll(".chip").forEach(c=>{
c.addEventListener("click",()=>{
document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
c.classList.add("active");
let f=c.dataset.filter;
document.querySelectorAll(".gruppo-tributo").forEach(g=>{
if(f=="all"||g.dataset.tributo==f){g.classList.remove("is-hidden")}else{g.classList.add("is-hidden")}
});
});
});
</script>
</body>
</html>
